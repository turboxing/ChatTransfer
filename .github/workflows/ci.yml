name: CI

on:
  push:
    branches: [main, forOpensource]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - run: npm test
      - name: Build frontend
        run: |
          cd frontend
          npm run build
